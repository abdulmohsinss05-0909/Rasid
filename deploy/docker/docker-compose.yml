# Rasid — full local stack: SQL Server + API + Worker + Web.
#   cd deploy/docker && docker compose up --build
#   App: http://localhost:8080
# Only the web container is published; API, Worker and SQL Server stay on the internal network.
# Local/demo use: the SQL 'sa' login is used here for simplicity. Hosted environments use
# dedicated least-privilege logins (see docs/08-security.md).

name: rasid

x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: ${RASID_ENVIRONMENT:-Development}
  ConnectionStrings__Rasid: Server=sql,1433;Database=Rasid;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
  Jwt__SigningKey: ${JWT_SIGNING_KEY}
  XApi__BearerToken: ${X_BEARER_TOKEN:-}
  Endpoints__WebApp__BaseUrl: http://localhost:8080
  Endpoints__Api__BaseUrl: http://localhost:8080/api
  Endpoints__Cors__AllowedOrigins__0: http://localhost:8080

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [internal]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: api
    image: rasid-api:local
    environment:
      <<: *backend-env
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    depends_on:
      sql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: worker
    image: rasid-worker:local
    environment:
      <<: *backend-env
    depends_on:
      sql:
        condition: service_healthy
      api:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        BUILD_CONFIGURATION: ${RASID_WEB_CONFIGURATION:-production}
    image: rasid-web:local
    ports:
      - "8080:8080"
    depends_on: [api]
    networks: [internal]
    restart: unless-stopped

volumes:
  sql-data:

networks:
  internal:
