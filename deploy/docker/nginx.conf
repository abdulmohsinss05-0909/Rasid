# Serves the Angular app and reverse-proxies /api to the API container (same origin for the SPA).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  include /etc/nginx/security-headers.inc;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /health/ {
    proxy_pass http://api:8080;
  }

  # API documentation (Swagger UI, OpenAPI document, Scalar). The API maps these only in Development and UAT;
  # in Production the request reaches the API and is refused there. The API sets its own security headers.
  location ~ ^/(swagger|openapi|scalar)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Sample media has fixed (non-hashed) file names: cache briefly.
  location ^~ /sample-media/ {
    expires 1d;
    include /etc/nginx/security-headers.inc;
  }

  # Hashed build assets: cache for a year.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|webp)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.inc;
  }

  # SPA routes fall back to index.html, which is never cached.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.inc;
  }
}
